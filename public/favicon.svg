<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5A3"/>
      <stop offset="50%" style="stop-color:#C5A059"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Ball body -->
  <circle cx="16" cy="16" r="14" fill="url(#gold)" stroke="#8B6914" stroke-width="0.5"/>
  <!-- Highlight shine -->
  <ellipse cx="11" cy="11" rx="5" ry="4" fill="url(#shine)"/>
  <!-- Number circle (like a snooker ball marking) -->
  <circle cx="16" cy="16" r="6" fill="#050505"/>
  <!-- R for Rack N Roll -->
  <text x="16" y="20" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#C5A059" text-anchor="middle">R</text>
</svg>
